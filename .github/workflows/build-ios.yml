name: Build iOS

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build-ios:
    runs-on: macos-13  # 使用 macOS runner
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive  # 包含 llama.cpp submodule
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.13.0'
        channel: 'stable'
    
    - name: Install dependencies
      run: |
        cd app
        flutter pub get
    
    - name: Check project structure
      run: |
        echo "=== Project structure ==="
        ls -la
        echo "\n=== Engine directory ==="
        ls -la engine/ || echo "No engine dir"
        echo "\n=== Third party ==="
        ls -la engine/third_party/ || echo "No third_party dir"
        echo "\n=== iOS project ==="
        ls -la app/ios/
    
    - name: Configure iOS project for unsigned build
      run: |
        cd app/ios
        # 禁用自动签名，允许无签名构建
        sed -i '' 's/ENABLE_BITCODE = YES/ENABLE_BITCODE = NO/g' Runner.xcodeproj/project.pbxproj || true
        sed -i '' 's/CODE_SIGN_IDENTITY = .*/CODE_SIGN_IDENTITY = "";/g' Runner.xcodeproj/project.pbxproj || true
        sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' Runner.xcodeproj/project.pbxproj || true
        echo "iOS project configured for manual signing"
    
    - name: Build iOS App (without signing)
      run: |
        cd app
        # 不使用 --no-codesign，而是配置 Xcode 跳过签名
        flutter build ios --release \
          --dart-define=TILMACH_TELEMETRY_URL="" \
          --dart-define=TILMACH_TELEMETRY_TAG="" \
          --dart-define=TILMACH_CONFIG_URL="" \
          || echo "Build failed as expected (missing engine library)"
    
    - name: Report
      if: always()
      run: |
        echo "=== Build attempt completed ==="
        echo "This is a diagnostic run to understand the build requirements."
        echo "Next step: we need to either:"
        echo "1. Find pre-compiled iOS engine libraries"
        echo "2. Or properly compile llama.cpp for iOS"
