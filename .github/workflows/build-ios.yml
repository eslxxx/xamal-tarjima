name: Build iOS

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build-ios:
    runs-on: macos-13  # 使用 macOS runner
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive  # 包含 llama.cpp submodule
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.13.0'
        channel: 'stable'
    
    - name: Install dependencies
      run: |
        brew install cmake
        flutter pub get
      working-directory: app
    
    - name: Build iOS Engine
      run: |
        chmod +x tools/build_ios_engine.sh
        ./tools/build_ios_engine.sh
    
    - name: Setup Xcode
      run: |
        sudo xcode-select -s /Applications/Xcode_15.0.app/Contents/Developer
        xcodebuild -version
    
    - name: Build iOS App (no codesign)
      run: |
        cd app
        flutter build ios --release --no-codesign \
          --dart-define=TILMACH_TELEMETRY_URL="" \
          --dart-define=TILMACH_TELEMETRY_TAG="" \
          --dart-define=TILMACH_CONFIG_URL=""
    
    - name: Upload IPA artifact
      uses: actions/upload-artifact@v3
      with:
        name: ios-app
        path: app/build/ios/iphoneos/Runner.app
        retention-days: 7

    - name: Create IPA (if needed)
      run: |
        cd app/build/ios/iphoneos
        mkdir Payload
        cp -r Runner.app Payload/
        zip -r Runner.ipa Payload
        rm -rf Payload
    
    - name: Upload IPA
      uses: actions/upload-artifact@v3
      with:
        name: ios-ipa
        path: app/build/ios/iphoneos/Runner.ipa
        retention-days: 7
