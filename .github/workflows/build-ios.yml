name: Build iOS

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build-ios:
    runs-on: macos-13  # 使用 macOS runner
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive  # 包含 llama.cpp submodule
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.13.0'
        channel: 'stable'
    
    - name: Install dependencies
      run: |
        cd app
        flutter pub get
    
    - name: Check project structure
      run: |
        echo "=== Project structure ==="
        ls -la
        echo "\n=== Engine directory ==="
        ls -la engine/ || echo "No engine dir"
        echo "\n=== Third party ==="
        ls -la engine/third_party/ || echo "No third_party dir"
        echo "\n=== iOS project ==="
        ls -la app/ios/
    
    - name: Build iOS App (no codesign, skip engine for now)
      run: |
        cd app
        # 先尝试直接构建，看看是否真的需要编译引擎
        flutter build ios --release --no-codesign \
          --dart-define=TILMACH_TELEMETRY_URL="" \
          --dart-define=TILMACH_TELEMETRY_TAG="" \
          --dart-define=TILMACH_CONFIG_URL="" || echo "Build failed as expected (missing engine)"
    
    - name: Report
      if: always()
      run: |
        echo "=== Build attempt completed ==="
        echo "This is a diagnostic run to understand the build requirements."
        echo "Next step: we need to either:"
        echo "1. Find pre-compiled iOS engine libraries"
        echo "2. Or properly compile llama.cpp for iOS"
